<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ACP Harnesses</title>
<style>
  /* Inherit the dashboard's palette where it is exposed, with readable
     fallbacks so the page is never white-on-white in a dark shell. */
  :root {
    --bg: var(--card, #17171c);
    --fg: var(--ink, #e8e8ef);
    --muted: #9a9aab;
    --line: #2e2e38;
    --accent: var(--accent, #7c5cff);
    --ok: #3fb950;
    --warn: #d29922;
    --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: transparent; color: var(--fg);
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .row {
    display: flex; align-items: flex-start; gap: 12px;
    border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; background: var(--bg);
  }
  .row.active { border-color: var(--accent); }
  .row.disabled { opacity: .55; }
  .grow { flex: 1; min-width: 0; }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; word-break: break-all; }
  .badge {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); white-space: nowrap;
  }
  .badge.ok { color: var(--ok); border-color: var(--ok); }
  .badge.bad { color: var(--bad); border-color: var(--bad); }
  .badge.on { color: var(--accent); border-color: var(--accent); }
  button {
    font: inherit; padding: 6px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--fg);
  }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: default; }
  .notice {
    border-left: 3px solid var(--warn); padding: 10px 14px; margin-bottom: 16px;
    color: var(--muted); background: rgba(210,153,34,.08); border-radius: 4px;
  }
  .notice.good { border-left-color: var(--ok); background: rgba(63,185,80,.08); }
  code { font-family: ui-monospace, monospace; font-size: 12px; }
</style>
</head>
<body>
<h1>ACP Harnesses</h1>
<p class="sub">Choose which coding agent backs this Kiro Crew. Uses your local installs.</p>
<div id="notices"></div>
<div id="list">Loading…</div>

<script>
const BASE = "/api/apps/acp-harnesses";
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

async function load() {
  let data;
  try {
    const r = await fetch(BASE + "/state");
    if (!r.ok) throw new Error("HTTP " + r.status);
    data = await r.json();
  } catch (e) {
    $("list").innerHTML =
      '<div class="notice">Could not reach the app API (' + esc(e.message) +
      '). Is the app enabled?</div>';
    return;
  }

  const notices = [];
  if (!data.sandboxOk && navigator.userAgent.includes("Win")) {
    notices.push(
      "<b>agent.sandbox_allow_unsandboxed_exec is off.</b> Windows has no " +
      "OS-level sandbox backend, so Kiro Crew will refuse to spawn any harness " +
      "until this is true."
    );
  }
  notices.push(
    "Switching takes effect for <b>new sessions after a restart</b> — " +
    "agent.acp_backend is read when the gateway starts."
  );
  $("notices").innerHTML = notices
    .map((n) => '<div class="notice">' + n + "</div>")
    .join("");

  $("list").innerHTML = data.harnesses.map(renderRow).join("");
  for (const h of data.harnesses) {
    const btn = document.getElementById("pick-" + (h.id || "kiro"));
    if (btn) btn.onclick = () => select(h.id);
  }
}

function renderRow(h) {
  const cls = ["row", h.active ? "active" : "", h.enabled ? "" : "disabled"]
    .filter(Boolean).join(" ");
  const badges = [];
  if (h.active) badges.push('<span class="badge on">active</span>');
  if (!h.enabled) badges.push('<span class="badge">disabled in manifest</span>');
  else if (h.installed) badges.push('<span class="badge ok">installed</span>');
  else badges.push('<span class="badge bad">not on PATH</span>');

  const meta = h.binary
    ? "<code>" + esc(h.binary) + "</code>"
    : h.enabled && !h.installed
      ? "needs <code>" + esc(h.command) + "</code> on PATH"
      : esc(h.note || "");

  const canPick = h.enabled && h.installed && !h.active;
  return (
    '<div class="' + cls + '">' +
      '<div class="grow">' +
        '<div class="name">' + esc(h.label) +
          ' <span class="badge">' + esc(h.dialect) + "</span></div>" +
        '<div class="meta">' + meta + "</div>" +
      "</div>" +
      '<div style="display:flex;gap:8px;align-items:center">' + badges.join("") +
        '<button id="pick-' + esc(h.id || "kiro") + '"' +
          (canPick ? "" : " disabled") + ">Use</button>" +
      "</div>" +
    "</div>"
  );
}

async function select(backend) {
  try {
    const r = await fetch(BASE + "/select", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ backend }),
    });
    const out = await r.json();
    if (!r.ok) throw new Error(out.error || "HTTP " + r.status);
    await load();
    $("notices").insertAdjacentHTML(
      "afterbegin",
      '<div class="notice good">Backend set to <b>' +
        esc(backend || "kiro-cli") +
        "</b>. Restart Kiro Crew for it to take effect.</div>"
    );
  } catch (e) {
    $("notices").insertAdjacentHTML(
      "afterbegin",
      '<div class="notice">Could not switch: ' + esc(e.message) + "</div>"
    );
  }
}

load();
</script>
</body>
</html>
